services:
  db:
    image: mysql:8.0
    container_name: comandas_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: comandas_db
    ports:
      - "3306:3306"
    volumes:
      - comandas_data:/var/lib/mysql
    restart: unless-stopped

  api:
    build: .
    container_name: pastelaria_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./src/.env
    restart: unless-stopped

volumes:
  comandas_data: